name: Android CI/CD

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Updated
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build Signed Release APK
        run: >
          ./gradlew assembleRelease
          -Pandroid.injected.signing.store.file=$(pwd)/release.jks
          -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v2 # Updated
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}