name: Android CI/CD

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        shell: python
        run: |
          import base64, os
          encoded = os.environ.get('SIGNING_KEY_BASE64')
          if encoded:
              with open('release.jks', 'wb') as f:
                  f.write(base64.b64decode(encoded))
          else:
              print('Error: SIGNING_KEY secret is empty')
              exit(1)

      - name: Build Signed Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_ALIAS" ]; then echo "Error: ALIAS secret is empty"; exit 1; fi
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then echo "Error: KEY_STORE_PASSWORD secret is empty"; exit 1; fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then echo "Error: KEY_PASSWORD secret is empty"; exit 1; fi
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
